services:
  backend:
    build:
      context: .
      dockerfile: 2_Backend_Node_API/Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: 3_Frontend_Web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
